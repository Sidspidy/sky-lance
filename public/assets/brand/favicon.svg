  <circle cx="19" cy="42" r="8" stroke="#17191C" stroke-width="3" fill="none" />
  <circle cx="45" cy="42" r="8" stroke="#17191C" stroke-width="3" fill="none" />
  <!-- Connecting aerodynamic spars -->
